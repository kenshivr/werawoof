<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WeraWoof — social preview 1280×640</title>
    <!--
      Fuente de la imagen social del repo (GitHub → Settings → Social preview).
      Render: Edge headless, ver docs/social-preview.png y el comando en el ADR/README.
    -->
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 800;
        src: url('../frontend/public/fonts/jakarta-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 500;
        src: url('../frontend/public/fonts/vietnam-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 600;
        src: url('../frontend/public/fonts/vietnam-600.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #fff8f5;
        font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        color: #382615;
      }
      .glow {
        position: absolute;
        right: -140px;
        top: -180px;
        width: 820px;
        height: 820px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffddb5 0%, rgba(255, 221, 181, 0) 68%);
      }
      .paw {
        position: absolute;
        opacity: 0.09;
      }
      .left {
        position: absolute;
        left: 72px;
        top: 60px;
        width: 700px;
      }
      .logo {
        height: 58px;
      }
      h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 60px;
        line-height: 1.06;
        letter-spacing: -1.5px;
        margin-top: 52px;
      }
      h1 em {
        font-style: normal;
        color: #e9931f;
      }
      .sub {
        margin-top: 22px;
        font-size: 24px;
        line-height: 1.45;
        color: #5a4030;
        font-weight: 500;
        max-width: 560px;
      }
      .chips {
        margin-top: 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        max-width: 680px;
      }
      .chip {
        border: 1.5px solid #e8d8c0;
        background: #fff;
        border-radius: 999px;
        padding: 7px 16px;
        font-size: 17px;
        font-weight: 600;
        color: #382615;
      }
      .foot {
        position: absolute;
        left: 72px;
        bottom: 48px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        font-weight: 600;
        color: #7d571e;
      }
      .foot .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #e9931f;
      }
      .phones {
        position: absolute;
        left: 820px;
        top: 70px;
        width: 460px;
        height: 570px;
      }
      .phone {
        position: absolute;
        border: 9px solid #382615;
        border-radius: 40px;
        overflow: hidden;
        background: #382615;
        box-shadow: 0 30px 60px rgba(56, 38, 21, 0.28);
      }
      .phone img {
        display: block;
        width: 100%;
      }
      .p1 {
        width: 262px;
        left: 20px;
        top: 40px;
        transform: rotate(-7deg);
        z-index: 2;
      }
      .p2 {
        width: 232px;
        left: 244px;
        top: 0;
        transform: rotate(7deg);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <img class="paw" src="../frontend/public/images/logo-icon.webp" alt="" style="left: 690px; top: 520px; width: 120px; transform: rotate(-22deg)" />
    <img class="paw" src="../frontend/public/images/logo-icon.webp" alt="" style="left: 600px; top: -20px; width: 90px; transform: rotate(16deg)" />
    <div class="left">
      <img class="logo" src="../frontend/public/images/logo-horizontal.webp" alt="WeraWoof" />
      <h1>Conectá patitas,<br />creá <em>recuerdos</em>.</h1>
      <p class="sub">Matches, playdates y chat en tiempo real para dueños de perros.</p>
      <div class="chips">
        <span class="chip">Nuxt 3</span>
        <span class="chip">Vue 3</span>
        <span class="chip">TypeScript</span>
        <span class="chip">Supabase</span>
        <span class="chip">Vercel</span>
        <span class="chip">PWA</span>
      </div>
    </div>
    <div class="foot">
      <span>werawoof.com</span>
      <span class="dot"></span>
      <span>github.com/kenshivr/werawoof</span>
    </div>
    <div class="phones">
      <div class="phone p2"><img src="screenshots/mobile-swipe.webp" alt="" /></div>
      <div class="phone p1"><img src="screenshots/mobile-match.webp" alt="" /></div>
    </div>
  </body>
</html>
